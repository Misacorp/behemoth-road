name: deploy

# Production: every push to main (a merged PR) deploys production. Nothing else can.
# Staging: only a manual run. In GitHub, Actions -> deploy -> "Run workflow", pick the branch to put on
# staging. Pushing a branch deploys nothing, so two branches never race for staging. A manual run always
# deploys staging, even when main is picked (that resets staging to main).
# Agents may start a manual run only when the owner asks in that session (see CLAUDE.md).
# Fork pull requests never trigger this workflow (they only trigger `pull_request` in ci.yml), so they never
# see these secrets. Secrets live in the GitHub environment of each target (scripts/github-setup.mjs).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    name: deploy (${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    env:
      TARGET_ENV: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      # Belt and braces: fail loudly if the target ever stops matching the trigger (for example after an
      # edit to the expressions above).
      - name: Guard the target
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$TARGET_ENV" = "production" ] && { [ "$EVENT" != "push" ] || [ "$REF" != "refs/heads/main" ]; }; then
            echo "::error::Production deploys only from a push to main (got $EVENT on $REF)."
            exit 1
          fi
          if [ "$TARGET_ENV" = "staging" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "::error::Staging deploys only from a manual run (got $EVENT)."
            exit 1
          fi
          if [ "$TARGET_ENV" != "production" ] && [ "$TARGET_ENV" != "staging" ]; then
            echo "::error::Unknown target '$TARGET_ENV'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No test step: the main ruleset requires the `ci` check and branches up to date before merging, so the
      # merged tree is exactly the tree PR CI tested.

      - run: pnpm build

      # The app's public key (`verify_key`, not a secret) checks the signatures of Discord interactions
      # (the Launch entry point). Read from Discord with the bot token, so nobody copies it by hand. A
      # failure is a warning: the Worker then deploys with the key empty and the interactions route off.
      - name: Read the Discord public key
        id: discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/discord-app.mjs public-key "$TARGET_ENV"

      # wrangler runs from our own lockfile, not a third-party deploy action, so the Cloudflare token is only
      # handed to code we pinned (docs/security.md).
      - name: Deploy Worker
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_PUBLIC_KEY: ${{ steps.discord.outputs.public_key }}
          GIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DISCORD_CLIENT_SECRET DISCORD_BOT_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the '$TARGET_ENV' GitHub environment:$missing (run node scripts/github-setup.mjs)"
            exit 1
          fi
          # Git ref names have no spaces or colons; anything outside this plain set is shown as "unknown".
          if ! [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]{1,100}$ ]]; then BRANCH="unknown"; fi
          # Worker secrets go in a temp JSON file passed with --secrets-file (never --var, which is public).
          secrets_file="$(mktemp -p "$RUNNER_TEMP" secrets.XXXXXX.json)"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n --arg cs "$DISCORD_CLIENT_SECRET" --arg bt "$DISCORD_BOT_TOKEN" \
            '{DISCORD_CLIENT_SECRET: $cs, DISCORD_BOT_TOKEN: $bt}' > "$secrets_file"
          # The public key is 64 hex characters or nothing (then wrangler.jsonc's empty value stays).
          key_var=()
          if [[ "$DISCORD_PUBLIC_KEY" =~ ^[0-9a-f]{64}$ ]]; then key_var=(--var "DISCORD_PUBLIC_KEY:${DISCORD_PUBLIC_KEY}"); fi
          pnpm exec wrangler deploy --env "$TARGET_ENV" --var "VERSION:${GIT_SHA}" --var "BRANCH:${BRANCH}" "${key_var[@]}" --secrets-file "$secrets_file"

      # Reads back what is live (the public /api/config) and fails the run unless it is this commit, so a green
      # run means users get exactly this build. Retries for up to two minutes.
      - name: Check the deployed commit
        env:
          GIT_SHA: ${{ github.sha }}
        run: node scripts/deployed.mjs --env "$TARGET_ENV" --expect "$GIT_SHA" --wait 120

      # Points the Activity's Launch command at our interactions endpoint, once that URL is set in the
      # Discord portal (docs/setup.md). Never fails the deploy (the script only warns).
      - name: Point Launch at the interactions endpoint
        if: steps.discord.outputs.public_key != ''
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/discord-app.mjs register "$TARGET_ENV"

      # Prints non-secret facts about the Discord app (Activities flag, installs, the bot's servers, the Launch
      # command) as notices, and warns on problems. Never fails the deploy.
      - name: Discord status
        if: ${{ !cancelled() }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/discord-app.mjs status "$TARGET_ENV"
